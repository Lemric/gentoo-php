name: Build PHP Scratch Images

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/lemric/gentoo-php
  IMAGE_NAME: php
  PHP_VERSION: '8.5.8'
  # GHA runners (7–16 GB RAM): avoid 32G Portage tmpfs from docker-builder defaults
  PORTAGE_TMPFS_SIZE: '4294967296'

jobs:
  build:
    name: bake all (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per native arch: builder-php once, then cli + fpm + sdk
          - arch: amd64
            runner: ubuntu-24.04
            bake_group: all-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            bake_group: all-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake cli + fpm + sdk (shared builder-php graph)
        env:
          PHP_GPG_KEYS: ${{ secrets.PHP_GPG_KEYS }}
          PHP_SHA256: ${{ secrets.PHP_SHA256 }}
        run: |
          set -euo pipefail
          args=(
            docker buildx bake -f docker-bake.hcl "${{ matrix.bake_group }}"
            --provenance=false
            --var "ARCH=${{ matrix.arch }}"
            --var "REGISTRY=${{ env.REGISTRY }}"
            --var "PHP_VERSION=${{ env.PHP_VERSION }}"
            --var "PORTAGE_TMPFS_SIZE=${{ env.PORTAGE_TMPFS_SIZE }}"
            --var "CACHE_SCOPE=gentoo-php-${{ matrix.arch }}"
            --var "PHP_GPG_KEYS=${PHP_GPG_KEYS}"
            --var "PHP_SHA256=${PHP_SHA256}"
          )
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            args+=(--push)
          fi
          "${args[@]}"

      - name: Load images for smoke tests (PR)
        if: github.event_name == 'pull_request'
        env:
          PHP_GPG_KEYS: ${{ secrets.PHP_GPG_KEYS }}
          PHP_SHA256: ${{ secrets.PHP_SHA256 }}
        run: |
          set -euo pipefail
          common=(
            --provenance=false
            --var "ARCH=${{ matrix.arch }}"
            --var "REGISTRY=${{ env.REGISTRY }}"
            --var "PHP_VERSION=${{ env.PHP_VERSION }}"
            --var "PORTAGE_TMPFS_SIZE=${{ env.PORTAGE_TMPFS_SIZE }}"
            --var "CACHE_SCOPE=gentoo-php-${{ matrix.arch }}"
            --var "PHP_GPG_KEYS=${PHP_GPG_KEYS}"
            --var "PHP_SHA256=${PHP_SHA256}"
          )
          for target in cli fpm extension-sdk; do
            docker buildx bake -f docker-bake.hcl "${target}" --load "${common[@]}"
          done

      - name: Smoke tests
        run: |
          set -euo pipefail
          repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          ver="${{ env.PHP_VERSION }}"
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            cli="${repo}:cli-${ver}-${{ matrix.arch }}"
            fpm="${repo}:fpm-${ver}-${{ matrix.arch }}"
            sdk="${repo}:sdk-${ver}-${{ matrix.arch }}"
            docker pull "$cli" "$fpm" "$sdk"
          else
            cli="${repo}:cli-${ver}"
            fpm="${repo}:fpm-${ver}"
            sdk="${repo}:sdk-${ver}"
          fi
          docker run --rm "$cli" php -v
          docker run --rm "$cli" php -r 'exit(posix_getuid() === 0 ? 1 : 0);'
          docker run --rm "$fpm" php-fpm -t
          docker run --rm "$sdk" php -v

  manifest:
    name: publish multi-arch manifests
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          ver="${{ env.PHP_VERSION }}"
          for variant in cli fpm sdk; do
            docker buildx imagetools create \
              -t "${repo}:${variant}-${ver}" \
              "${repo}:${variant}-${ver}-amd64" \
              "${repo}:${variant}-${ver}-arm64"
          done

      - name: Smoke tests (multi-arch tags)
        run: |
          set -euo pipefail
          repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          ver="${{ env.PHP_VERSION }}"
          docker pull "${repo}:cli-${ver}" "${repo}:fpm-${ver}" "${repo}:sdk-${ver}"
          docker run --rm "${repo}:cli-${ver}" php -v
          docker run --rm "${repo}:cli-${ver}" php -r 'exit(posix_getuid() === 0 ? 1 : 0);'
          docker run --rm "${repo}:fpm-${ver}" php-fpm -t
          docker run --rm "${repo}:sdk-${ver}" php -v
