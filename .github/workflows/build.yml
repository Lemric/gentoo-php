name: Build PHP Scratch Images

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/lemric/gentoo-php
  IMAGE_NAME: php
  PHP_VERSION: '8.5.8'
  PORTAGE_TMPFS_SIZE: '4294967296'

jobs:
  build:
    name: bake all (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            bake_group: all-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            bake_group: all-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake runtime + build helpers (shared builder-php graph)
        id: bake
        env:
          PHP_GPG_KEYS: ${{ secrets.PHP_GPG_KEYS }}
          PHP_SHA256: ${{ secrets.PHP_SHA256 }}
        run: |
          set -euo pipefail
          args=(
            docker buildx bake -f docker-bake.hcl "${{ matrix.bake_group }}"
            --provenance=false
            --var "ARCH=${{ matrix.arch }}"
            --var "REGISTRY=${{ env.REGISTRY }}"
            --var "PHP_VERSION=${{ env.PHP_VERSION }}"
            --var "PORTAGE_TMPFS_SIZE=${{ env.PORTAGE_TMPFS_SIZE }}"
            --var "CACHE_SCOPE=gentoo-php-${{ matrix.arch }}"
            --var "PHP_GPG_KEYS=${PHP_GPG_KEYS}"
            --var "PHP_SHA256=${PHP_SHA256}"
          )
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            args+=(--push)
          fi
          "${args[@]}"

      - name: Load images for smoke tests (PR)
        if: github.event_name == 'pull_request'
        env:
          PHP_GPG_KEYS: ${{ secrets.PHP_GPG_KEYS }}
          PHP_SHA256: ${{ secrets.PHP_SHA256 }}
        run: |
          set -euo pipefail
          common=(
            --provenance=false
            --var "ARCH=${{ matrix.arch }}"
            --var "REGISTRY=${{ env.REGISTRY }}"
            --var "PHP_VERSION=${{ env.PHP_VERSION }}"
            --var "PORTAGE_TMPFS_SIZE=${{ env.PORTAGE_TMPFS_SIZE }}"
            --var "CACHE_SCOPE=gentoo-php-${{ matrix.arch }}"
            --var "PHP_GPG_KEYS=${PHP_GPG_KEYS}"
            --var "PHP_SHA256=${PHP_SHA256}"
          )
          for target in cli fpm cli-build; do
            docker buildx bake -f docker-bake.hcl "${target}" --load "${common[@]}"
          done

      - name: Smoke tests (per-arch)
        if: steps.bake.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          ver="${{ env.PHP_VERSION }}"
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            suffix="-${{ matrix.arch }}"
            for img in \
              "${repo}:cli-${ver}${suffix}" \
              "${repo}:fpm-${ver}${suffix}" \
              "${repo}:cli-build-${ver}${suffix}"; do
              docker pull "$img"
            done
          else
            suffix=""
          fi
          cli="${repo}:cli-${ver}${suffix}"
          fpm="${repo}:fpm-${ver}${suffix}"
          build="${repo}:cli-build-${ver}${suffix}"
          docker run --rm "$cli" php -v
          docker run --rm "$cli" php -r 'exit(posix_getuid() === 0 ? 1 : 0);'
          docker run --rm "$cli" test ! -x /usr/local/bin/pie
          docker run --rm "$cli" test ! -x /usr/local/bin/phpize
          docker run --rm "$build" test -x /usr/local/bin/pie
          docker run --rm "$build" test -x /usr/local/bin/phpize
          docker run --rm "${repo}:fpm-${ver}${suffix}" php-fpm -t
          docker run --rm --entrypoint /usr/local/bin/php "$fpm" /usr/local/libexec/php/docker-php-healthcheck.php readiness

  manifest:
    name: publish multi-arch manifests
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify per-arch images exist
        run: |
          set -euo pipefail
          repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          ver="${{ env.PHP_VERSION }}"
          for variant in cli fpm cli-build fpm-build; do
            for arch in amd64 arm64; do
              docker buildx imagetools inspect "${repo}:${variant}-${ver}-${arch}"
            done
          done

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          ver="${{ env.PHP_VERSION }}"
          for variant in cli fpm cli-build fpm-build; do
            docker buildx imagetools create \
              -t "${repo}:${variant}-${ver}" \
              "${repo}:${variant}-${ver}-amd64" \
              "${repo}:${variant}-${ver}-arm64"
          done

      - name: Remove per-arch tags (public tags are unsuffixed)
        run: |
          set -euo pipefail
          repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          ver="${{ env.PHP_VERSION }}"
          for variant in cli fpm cli-build fpm-build; do
            for arch in amd64 arm64; do
              docker buildx imagetools rm "${repo}:${variant}-${ver}-${arch}" || true
            done
          done

      - name: Smoke tests (multi-arch tags)
        run: |
          set -euo pipefail
          repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          ver="${{ env.PHP_VERSION }}"
          for img in \
            "${repo}:cli-${ver}" \
            "${repo}:fpm-${ver}" \
            "${repo}:cli-build-${ver}"; do
            docker pull "$img"
          done
          docker run --rm "${repo}:cli-${ver}" php -v
          docker run --rm "${repo}:cli-${ver}" test ! -x /usr/local/bin/pie
          docker run --rm "${repo}:cli-build-${ver}" test -x /usr/local/bin/pie
          docker run --rm "${repo}:fpm-${ver}" php-fpm -t

          echo "Multi-arch manifests:"
          for variant in cli fpm cli-build fpm-build; do
            docker buildx imagetools inspect "${repo}:${variant}-${ver}"
          done
