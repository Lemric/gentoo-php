name: Build PHP Scratch Images

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/lemric/gentoo-php
  IMAGE_NAME: php
  PHP_VERSION: '8.5.8'
  # GHA runners (7–16 GB RAM): avoid 32G Portage tmpfs from docker-builder defaults
  PORTAGE_TMPFS_SIZE: '4294967296'

jobs:
  build:
    name: ${{ matrix.tag }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 — native x86_64 runner (no QEMU)
          - tag: cli
            docker_target: cli
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - tag: fpm
            docker_target: fpm
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - tag: sdk
            docker_target: extension-sdk
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          # arm64 — native ARM64 runner (no QEMU)
          - tag: cli
            docker_target: cli
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - tag: fpm
            docker_target: fpm
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - tag: sdk
            docker_target: extension-sdk
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.PHP_VERSION }}-${{ matrix.tag }}-${{ matrix.arch }}
            type=raw,value=${{ env.PHP_VERSION }}-${{ matrix.tag }},enable=${{ matrix.arch == 'amd64' }}
            type=raw,value=${{ env.PHP_VERSION }}-${{ matrix.tag }}-${{ matrix.arch }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}-${{ matrix.tag }}-${{ matrix.arch }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}-${{ matrix.tag }},enable=${{ matrix.arch == 'amd64' && startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.docker_target }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            PHP_GPG_KEYS=${{ secrets.PHP_GPG_KEYS }}
            PHP_SHA256=${{ secrets.PHP_SHA256 }}
            GENTOO_CACHE_ID=${{ matrix.arch }}
            PORTAGE_TMPFS_SIZE=${{ env.PORTAGE_TMPFS_SIZE }}
            GENTOO_SYNC=0
          cache-from: type=gha,scope=${{ matrix.tag }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}-${{ matrix.arch }}
          provenance: false

      - name: Smoke test (cli)
        if: matrix.tag == 'cli'
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PHP_VERSION }}-cli-${{ matrix.arch }}"
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            docker pull "$IMG"
          fi
          docker run --rm "$IMG" php -v
          docker run --rm "$IMG" php -r 'exit(posix_getuid() === 0 ? 1 : 0);'

      - name: Smoke test (fpm)
        if: matrix.tag == 'fpm'
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PHP_VERSION }}-fpm-${{ matrix.arch }}"
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            docker pull "$IMG"
          fi
          docker run --rm "$IMG" php-fpm -t

      - name: Smoke test (sdk)
        if: matrix.tag == 'sdk'
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PHP_VERSION }}-sdk-${{ matrix.arch }}"
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            docker pull "$IMG"
          fi
          docker run --rm "$IMG" php -v
