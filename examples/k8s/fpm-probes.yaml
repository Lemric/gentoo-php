# FPM on Kubernetes — startup / liveness / readiness probes
#
# Requires gentoo-php FPM image with docker-php-healthcheck (default in fpm-* tags).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-fpm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: php-fpm
  template:
    metadata:
      labels:
        app: php-fpm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
      containers:
        - name: php-fpm
          image: ghcr.io/lemric/gentoo-php/php:fpm-8.5.8
          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["/usr/local/bin/docker-php-healthcheck", "startup"]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["/usr/local/bin/docker-php-healthcheck", "liveness"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/usr/local/bin/docker-php-healthcheck", "readiness"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
