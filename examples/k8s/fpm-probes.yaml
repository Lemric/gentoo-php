# FPM on Kubernetes — hardened startup / liveness / readiness probes
#
# Production fpm-* images: no /bin/sh — probes use php or php-fpm directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-fpm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: php-fpm
  template:
    metadata:
      labels:
        app: php-fpm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: php-fpm
          image: ghcr.io/lemric/gentoo-php/php:fpm-8.5.8
          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["/usr/local/sbin/php-fpm", "-t"]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/php
                - /usr/local/libexec/php/docker-php-healthcheck.php
                - liveness
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/php
                - /usr/local/libexec/php/docker-php-healthcheck.php
                - readiness
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
