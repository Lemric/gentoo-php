; Optional extra lockdown — COPY into downstream image only when you accept framework breakage
; Disables Composer in-container, Laravel queues (pcntl), Process, storage:link (symlink), Dotenv (putenv)
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_only_cookies = 1
disable_functions = exec,passthru,shell_exec,system,proc_close,proc_get_status,proc_nice,proc_open,proc_terminate,popen,pcntl_exec,pcntl_fork,pcntl_signal,pcntl_wait,pcntl_waitpid,pcntl_wexitstatus,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wstopsig,pcntl_wtermsig,pcntl_alarm,pcntl_getpriority,pcntl_setpriority,dl,link,symlink,chmod,chown,chgrp,putenv,ini_alter,ini_restore,apache_setenv,show_source,highlight_file,mail,openlog,syslog
