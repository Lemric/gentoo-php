; Production defaults — docker-library/php parity for Symfony, Laravel, Composer
; Runtime cli/fpm only (stripped from *-build). Optional lockdown: hardening-strict.ini
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
ignore_repeated_errors = On
date.timezone = UTC
allow_url_include = Off
file_uploads = On
enable_dl = Off
