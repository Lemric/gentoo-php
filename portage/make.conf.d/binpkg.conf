# Binary packages — reuse compiled atoms across image builds (same version/USE/CHOST).
# Requires persistent /var/cache/binhost mount in docker/Dockerfile.
#
# getbinpkg  — install from binhost when a matching .tbz2 exists
# buildpkg   — save .tbz2 after compiling from source (feeds the next build)
PKGDIR="/var/cache/binhost"
PORTAGE_BINHOST="file:///var/cache/binhost"
FEATURES="${FEATURES} getbinpkg buildpkg binpkg-logs"
