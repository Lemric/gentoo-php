# Gentoo PHP scratch image — global Portage configuration
#
# CONSERVATIVE flags for emerge @world / @php-toolchain.
# Aggressive -O3/LTO/pie apply ONLY to PHP via docker-php-env (configure-php.sh).
#
# Global -pie / -flto in LDFLAGS breaks shared library builds (readline, etc.).

COMMON_FLAGS="-O2 -pipe -fstack-protector-strong -fstack-clash-protection \
	-Wformat -Werror=format-security \
	-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

LDFLAGS="-Wl,-O1 -Wl,-z,relro -Wl,-z,now -Wl,-z,noexecstack \
	-Wl,-z,separate-code -Wl,--as-needed"

# pie/ssp via hardened profile; NOT global static-libs (PHP needs shared .so at runtime)
USE="hardened pie ssp -bindist -static-libs \
	-X -wayland -vulkan -qt5 -qt6 -kde -gnome -pulseaudio \
	-doc -examples -test -debug"

EMERGE_DEFAULT_OPTS="--quiet-build=y --with-bdeps=y --complete-graph=y"

FEATURES="${FEATURES} -sandbox -usersandbox -ipc-sandbox -network-sandbox -pid-sandbox parallel-fetch -test"

PHP_BUILD_PROVIDER="https://github.com/gentoo-php/gentoo-php"
